<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChefMaster - Recetas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-logo" id="logo"> <span>ChefMaster</span></div>
    <ul class="navbar-links">
      <li class="active" data-pagina="home">Inicio</li>
      <li data-pagina="recetas">Recetas</li>
      <li data-pagina="favoritos">Mis Favoritos</li>
      <li data-pagina="login">Iniciar Sesión</li>
    </ul>
  </nav>

  <main class="main-container">

    
    <section id="pagina-home" class="pagina active">
      <div class="home-hero">
        <div class="hero-content">
          <h1>¿Qué vas a cocinar hoy?</h1>
          <p>Encuentra miles de recetas ingresando tus ingredientes o platillo favorito</p>

          <form id="form-busqueda" class="search-box">
            <input type="text" id="input-busqueda" placeholder="Ej: Pollo, cebolla, tomate...">
            <button type="submit" class="btn-primary">Buscar</button>
          </form>
        </div>
      </div>
    </section>

  
    <section id="pagina-recetas" class="pagina">
      <h2>Explora Nuestras Recetas</h2>
      <div class="grid-recetas" id="grid-recetas"></div>
    </section>

    
    <section id="pagina-detalle" class="pagina">
      <div class="detalle-card" id="detalle-card"></div>
    </section>

    
    <section id="pagina-login" class="pagina">
      <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <form id="form-login">
          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required>
          </div>
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required>
          </div>
          <button type="submit" class="btn-primary" id="btn-login">Ingresar</button>
        </form>
      </div>
    </section>

    
    <section id="pagina-favoritos" class="pagina">
      <h2>Mis Recetas Guardadas</h2>
      <div id="lista-favoritos"></div>
    </section>

  </main>

  <script src="js/recetas-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
